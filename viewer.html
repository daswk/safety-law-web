<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#f8f9fa">
    <title>원문 보기 - 안전법령 통합검색 플랫폼</title>
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        html, body { margin: 0; background: #e8eaed; font-family: 'Pretendard', sans-serif; color: #202124; }
        .bar { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid #dadce0; padding: 10px 14px calc(10px) 14px; padding-top: calc(10px + env(safe-area-inset-top)); display: flex; align-items: center; gap: 10px; }
        .back { border: none; background: #f1f3f4; border-radius: 18px; padding: 8px 14px; font-size: 14px; font-weight: 600; color: #3c4043; cursor: pointer; font-family: inherit; flex-shrink: 0; }
        .ttl { flex: 1; min-width: 0; }
        .ttl b { display: block; font-size: 15px; color: #188038; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ttl span { font-size: 12px; color: #70757a; }
        #pages { max-width: 900px; margin: 0 auto; padding: 12px 8px 40px; }
        .pg { background: #fff; margin: 0 auto 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.15); position: relative; }
        .pg canvas { display: block; width: 100%; height: auto; }
        .pg .no { position: absolute; right: 8px; bottom: 6px; font-size: 11px; color: #9aa0a6; }
        .msg { text-align: center; color: #5f6368; padding: 40px 10px; font-size: 15px; }
        .err { color: #d93025; }
    </style>
</head>
<body>
    <div class="bar">
        <button class="back" onclick="goBack()">← 검색</button>
        <div class="ttl"><b id="title">원문 보기</b><span id="sub"></span></div>
    </div>
    <div id="pages"><div class="msg" id="msg">원문을 불러오는 중입니다... ⏳</div></div>

    <script type="module">
        const PDFJS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38';
        const q = new URLSearchParams(location.search);
        const file = q.get('f') || '';
        const from = Math.max(1, parseInt(q.get('from') || '1', 10));
        let to = parseInt(q.get('to') || from, 10);
        const title = q.get('t') || '원문 보기';
        document.getElementById('title').textContent = title;
        document.title = title + ' - 원문 보기';

        window.goBack = () => { if (history.length > 1) history.back(); else location.href = './'; };

        // 이 사이트 안의 PDF 파일만 열 수 있도록 제한
        if (!/^docs\/[\w\-\/]+\.pdf$/.test(file)) {
            document.getElementById('msg').innerHTML = '<span class="err">잘못된 주소입니다.</span>';
            throw new Error('invalid file');
        }

        try {
            const pdfjsLib = await import(`${PDFJS}/build/pdf.min.mjs`);
            pdfjsLib.GlobalWorkerOptions.workerSrc = `${PDFJS}/build/pdf.worker.min.mjs`;
            const pdf = await pdfjsLib.getDocument({
                url: file,
                cMapUrl: `${PDFJS}/cmaps/`, cMapPacked: true,
                standardFontDataUrl: `${PDFJS}/standard_fonts/`,
                disableAutoFetch: true, disableStream: true, rangeChunkSize: 262144
            }).promise;

            to = Math.min(to, pdf.numPages);
            const total = to - from + 1;
            document.getElementById('sub').textContent = `총 ${total}쪽 · 손가락으로 확대할 수 있어요`;
            const wrap = document.getElementById('pages');
            wrap.innerHTML = '';

            // 쪽 자리를 먼저 만들고, 화면에 가까워지면 그림
            const holders = [];
            const first = await pdf.getPage(from);
            const vp1 = first.getViewport({ scale: 1 });
            for (let n = from; n <= to; n++) {
                const d = document.createElement('div');
                d.className = 'pg'; d.dataset.n = n;
                d.style.aspectRatio = `${vp1.width} / ${vp1.height}`;
                d.innerHTML = `<span class="no">${n - from + 1} / ${total}</span>`;
                wrap.appendChild(d); holders.push(d);
            }

            const render = async (d) => {
                if (d.dataset.done) return; d.dataset.done = '1';
                const page = await pdf.getPage(parseInt(d.dataset.n, 10));
                const base = page.getViewport({ scale: 1 });
                d.style.aspectRatio = `${base.width} / ${base.height}`;
                const cssW = d.clientWidth || 800;
                const scale = (cssW / base.width) * Math.min(window.devicePixelRatio || 1, 2.5);
                const vp = page.getViewport({ scale });
                const c = document.createElement('canvas');
                c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
                d.prepend(c);
                await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
            };

            const io = new IntersectionObserver((ents) => {
                ents.forEach(en => { if (en.isIntersecting) { render(en.target); io.unobserve(en.target); } });
            }, { rootMargin: '600px 0px' });
            holders.forEach(h => io.observe(h));
        } catch (e) {
            console.error(e);
            document.getElementById('pages').innerHTML =
                `<div class="msg err">원문을 불러오지 못했습니다.<br><span style="font-size:13px;color:#5f6368">새로고침 후 다시 시도해 주세요.</span><br><br><a href="${file}#page=${from}" style="color:#188038">PDF 파일로 직접 열기</a></div>`;
        }
    </script>
</body>
</html>
